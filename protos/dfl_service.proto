syntax = "proto3";

package dfl;

service DFLService {
  // A node sends its local model weights to a peer
  rpc GossipWeights (WeightRequest) returns (WeightResponse);
}

message WeightRequest {
  int32 node_id = 1;
  bytes model_data = 2; // This will hold the PyTorch weights (serialized NumPy array)
}

message WeightResponse {
  bool success = 1;
}