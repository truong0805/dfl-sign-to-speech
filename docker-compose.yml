services:
  node1:
    build: .
    volumes:
      - .:/app
      - ./data_shards/node1:/app/data
    environment:
      - NODE_ID=1
      - NEIGHBORS=node2,node3,node4,node5
      - LOCAL_EPOCHS=3
      - GOSSIP_INTERVAL=30
      - MAX_ROUNDS=10

  node2:
    build: .
    volumes:
      - .:/app
      - ./data_shards/node2:/app/data
    environment:
      - NODE_ID=2
      - NEIGHBORS=node1,node3,node4,node5
      - LOCAL_EPOCHS=3
      - GOSSIP_INTERVAL=30
      - MAX_ROUNDS=10

  node3:
    build: .
    volumes:
      - .:/app
      - ./data_shards/node3:/app/data
    environment:
      - NODE_ID=3
      - NEIGHBORS=node1,node2,node4,node5
      - LOCAL_EPOCHS=3
      - GOSSIP_INTERVAL=30
      - MAX_ROUNDS=10

  node4:
    build: .
    volumes:
      - .:/app
      - ./data_shards/node4:/app/data
    environment:
      - NODE_ID=4
      - NEIGHBORS=node1,node2,node3,node5
      - LOCAL_EPOCHS=3
      - GOSSIP_INTERVAL=30
      - MAX_ROUNDS=10

  node5:
    build: .
    volumes:
      - .:/app
      - ./data_shards/node5:/app/data
    environment:
      - NODE_ID=5
      - NEIGHBORS=node1,node2,node3,node4
      - LOCAL_EPOCHS=3
      - GOSSIP_INTERVAL=30
      - MAX_ROUNDS=10