version: '3.8'

services:
  node1:
    build: .
    volumes:
      - .:/app
    environment:
      - NODE_ID=1
      - NEIGHBORS=node2,node3,node4,node5

  node2:
    build: .
    volumes:
      - .:/app
    environment:
      - NODE_ID=2
      - NEIGHBORS=node1,node3,node4,node5

  node3:
    build: .
    volumes:
      - .:/app
    environment:
      - NODE_ID=3
      - NEIGHBORS=node1,node2,node4,node5

  node4:
    build: .
    volumes:
      - .:/app
    environment:
      - NODE_ID=4
      - NEIGHBORS=node1,node2,node3,node5

  node5:
    build: .
    volumes:
      - .:/app
    environment:
      - NODE_ID=5
      - NEIGHBORS=node1,node2,node3,node4